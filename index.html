<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#e3f2fd,#90caf9);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:18px;
  box-shadow:0 6px 14px rgba(0,0,0,0.2);
  width:300px;
  text-align:center;
}

input{
  width:90%;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#1565c0;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h2>🧊 Login Sistem</h2>

  <input type="text" id="user" placeholder="Username">
  <input type="password" id="pass" placeholder="Password">

  <button onclick="login()">Login</button>
</div>

<script>
/*
  LOGIN LOKAL
  Tidak menggunakan Firebase.
  Data username, password, kode, dan role disimpan di JavaScript.
*/
const accounts = {
  "user1": {
    password: "123",
    kode: "USR01",
    role: "user"
  },
  "user2": {
    password: "123",
    kode: "USR02",
    role: "user"
  },
  "teknisi1": {
    password: "123",
    kode: "TKN01",
    role: "teknisi"
  },
  "teknisi2": {
    password: "123",
    kode: "TKN02",
    role: "teknisi"
  }
};

function login(){
  const username = document.getElementById("user").value.trim();
  const password = document.getElementById("pass").value;
  const account = accounts[username];

  if(!account || account.password !== password){
    alert("Username atau password salah!");
    return;
  }

  const session = {
    username: username,
    kode: account.kode,
    role: account.role,
    loginAt: Date.now()
  };

  sessionStorage.setItem("petugasLogin", JSON.stringify(session));

  window.location = account.role === "teknisi"
    ? "teknisi.html"
    : "user.html";
}
</script>

</body>
</html>
